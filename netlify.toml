[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 requiere Node 20.19+; se fija la versión para no depender
# del valor por defecto de Netlify.
[build.environment]
  NODE_VERSION = "22"

# El sistema vive ahora en intranet.positivogroup.com, sobre servidor propio y
# MySQL. Este sitio queda únicamente como reenvío.
#
# Existe por una razón concreta: las cotizaciones que ya se enviaron a clientes
# llevan enlaces del tipo cotizador-positivo.netlify.app/c/<testigo>. Los
# testigos viajaron en el respaldo y son los mismos en el dominio nuevo, así
# que reenviar la dirección completa hace que esos enlaces sigan abriendo.
#
# El reenvío es de todo el sitio, no solo de /c/*, y eso es deliberado: si el
# equipo pudiera seguir entrando por la dirección vieja, crearía cotizaciones
# en la base anterior y los datos se separarían en dos sistemas.
#
# force = true es imprescindible. Sin él Netlify serviría el index.html
# publicado —que existe— en vez de reenviar.
[[redirects]]
  from = "/*"
  to = "https://intranet.positivogroup.com/:splat"
  status = 301
  force = true
