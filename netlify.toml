[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 requiere Node 20.19+; se fija la versión para no depender
# del valor por defecto de Netlify.
[build.environment]
  NODE_VERSION = "22"

# La app es una SPA: cualquier ruta debe servir index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El HTML no se cachea: así, apenas se publica una versión nueva, cualquier
# dispositivo la ve al recargar en vez de quedarse con la copia anterior.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los archivos de assets llevan un hash en el nombre y cambian de nombre en
# cada build, así que se pueden cachear indefinidamente sin quedar obsoletos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
