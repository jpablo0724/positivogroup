[build]
  command = "npm run build"
  publish = "dist"

# Vite 8 requiere Node 20.19+; se fija la versión para no depender
# del valor por defecto de Netlify.
[build.environment]
  NODE_VERSION = "22"

# Las rutas /api/* van a la función serverless. Debe ir ANTES del catch-all
# de la SPA, porque los redirects se evalúan en orden y si no, "/*" se las
# tragaría y devolvería el index.html.
[[redirects]]
  from = "/api/clientify/*"
  to = "/.netlify/functions/clientify/:splat"
  status = 200

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin/:splat"
  status = 200

[[redirects]]
  from = "/api/cotizaciones"
  to = "/.netlify/functions/cotizaciones"
  status = 200

[[redirects]]
  from = "/api/cotizaciones/*"
  to = "/.netlify/functions/cotizaciones/:splat"
  status = 200

[[redirects]]
  from = "/api/productos"
  to = "/.netlify/functions/productos"
  status = 200

[[redirects]]
  from = "/api/productos/*"
  to = "/.netlify/functions/productos/:splat"
  status = 200

[[redirects]]
  from = "/api/numero"
  to = "/.netlify/functions/numero"
  status = 200

# La app es una SPA: cualquier otra ruta debe servir index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# El HTML no se cachea: así, apenas se publica una versión nueva, cualquier
# dispositivo la ve al recargar en vez de quedarse con la copia anterior.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Los archivos de assets llevan un hash en el nombre y cambian de nombre en
# cada build, así que se pueden cachear indefinidamente sin quedar obsoletos.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
