<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- El ?v= no es decorativo: los navegadores guardan los favicons en un
         almacén propio que ignora las cabeceras de caché, así que cambiar el
         archivo no basta para que se vean el nuevo. Lo que sí funciona es que
         cambie la dirección. Al reemplazar el icono, subir el número. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Positivo Group | Cotizaciones</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- La vista de impresión se monta aquí, fuera de #root, para que al
         imprimir se pueda ocultar toda la aplicación y quede solo la
         cotización. -->
    <div id="impresion"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
