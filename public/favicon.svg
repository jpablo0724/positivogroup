<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 6 88 88">
  <title>Positivo Group</title>
  <!-- La marca de Positivo Group: dos anillos cuadrados entrelazados con el
       degradado de naranja a carmín. Es el mismo dibujo que PositivoLogo.tsx,
       recortado al contorno para que llene la pestaña del navegador. -->
  <defs>
    <linearGradient
      id="marca"
      x1="8"
      y1="92"
      x2="92"
      y2="8"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#F97A1F" />
      <stop offset="45%" stop-color="#EF2D3C" />
      <stop offset="100%" stop-color="#E8145B" />
    </linearGradient>
  </defs>

  <path
    fill="url(#marca)"
    fill-rule="evenodd"
    d="M6 44h46v46H6V44Zm14 14v18h18V58H20Z"
  />
  <path
    fill="url(#marca)"
    fill-rule="evenodd"
    d="M40 10h46v46H40V10Zm14 14v18h18V24H54Z"
  />
</svg>
